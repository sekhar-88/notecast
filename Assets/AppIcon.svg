<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="cardClip">
      <path d="M 364 252 L 612 252 L 740 380 L 740 708 A 64 64 0 0 1 676 772 L 364 772 A 64 64 0 0 1 300 708 L 300 316 A 64 64 0 0 1 364 252 Z"/>
    </clipPath>
    <linearGradient id="cardFill" x1="300" y1="252" x2="740" y2="772" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#222B42"/>
      <stop offset="55%" stop-color="#151B2B"/>
      <stop offset="100%" stop-color="#0E121F"/>
    </linearGradient>
    <linearGradient id="neonBorder" x1="300" y1="252" x2="740" y2="772" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22E5FF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="flapFill" x1="612" y1="252" x2="740" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22E5FF" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="sparkFill" x1="626" y1="616" x2="626" y2="716" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0FFFF"/>
      <stop offset="100%" stop-color="#22E5FF"/>
    </linearGradient>
    <filter id="cardShadow" x="-25%" y="-25%" width="150%" height="155%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#000000" flood-opacity="0.62"/>
    </filter>
    <filter id="accentGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#22E5FF" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g transform="translate(512 512) scale(1.48) translate(-508 -514)">
    <!-- Back Ghost Outline Sheet -->
    <rect x="294" y="268" width="408" height="494" rx="60" ry="60"
          fill="#131726" fill-opacity="0.58"
          stroke="#A855F7" stroke-opacity="0.62" stroke-width="10"
          transform="rotate(7.5 492 524)"/>

    <!-- Primary Folded-Corner Floating Note Card -->
    <path d="M 364 252 L 612 252 L 740 380 L 740 708 A 64 64 0 0 1 676 772 L 364 772 A 64 64 0 0 1 300 708 L 300 316 A 64 64 0 0 1 364 252 Z"
          fill="#151B2B" filter="url(#cardShadow)"/>

    <g clip-path="url(#cardClip)">
      <rect x="300" y="252" width="440" height="520" fill="url(#cardFill)"/>

      <path d="M 612 252 L 612 356 Q 612 380 636 380 L 740 380 Z" fill="url(#flapFill)"/>
      <path d="M 612 258 L 612 356 Q 612 380 636 380 L 734 380"
            fill="none" stroke="#22E5FF" stroke-opacity="0.72" stroke-width="7" stroke-linecap="round"/>

      <rect x="374" y="394" width="196" height="36" rx="18" fill="#22E5FF" filter="url(#accentGlow)"/>
      <rect x="374" y="494" width="290" height="28" rx="14" fill="#F1F5FF" fill-opacity="0.94"/>
      <rect x="374" y="578" width="222" height="28" rx="14" fill="#CBD5E1" fill-opacity="0.76"/>
      <rect x="374" y="662" width="134" height="28" rx="14" fill="#94A3B8" fill-opacity="0.56"/>

      <path d="M 626 616 C 626 658 634 666 676 666 C 634 666 626 674 626 716 C 626 674 618 666 576 666 C 618 666 626 658 626 616 Z"
            fill="url(#sparkFill)" filter="url(#accentGlow)"/>
    </g>

    <path d="M 364 252 L 612 252 L 740 380 L 740 708 A 64 64 0 0 1 676 772 L 364 772 A 64 64 0 0 1 300 708 L 300 316 A 64 64 0 0 1 364 252 Z"
          fill="none" stroke="url(#neonBorder)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
